name: Release

# Tag a commit on main as vMAJOR.MINOR.PATCH and push the tag; this signs the release
# APK with the keystore held in repository secrets and attaches it to a GitHub Release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - uses: gradle/actions/setup-gradle@v5

      # keystore.properties in the project root is what app/build.gradle.kts loads
      # (https://developer.android.com/studio/publish/app-signing). The keystore itself
      # is decoded outside the workspace and removed again in the last step.
      - name: Install signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$SIGNING_STORE_PASSWORD"
            echo "keyAlias=$SIGNING_KEY_ALIAS"
            echo "keyPassword=$SIGNING_KEY_PASSWORD"
          } > keystore.properties

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build signed release APK
        run: ./gradlew assembleRelease -PreleaseVersion="${GITHUB_REF_NAME#v}"

      - name: Verify signature and name the APK
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk)
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$apk"
          mv "$apk" "RemoteSync-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "RemoteSync-${GITHUB_REF_NAME}.apk" --title "$GITHUB_REF_NAME" --generate-notes

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties
